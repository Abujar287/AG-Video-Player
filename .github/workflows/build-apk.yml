name: Build AG Video Player v1.0.33 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Release APK (v1.0.33)
      env:
        appVersionCode: "33"
        appVersionName: "1.0.33"
        githubRepoSlug: "Abujar287/AG-Video-Player"
      run: |
        chmod +x ./gradlew
        ./gradlew assembleRelease --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AG-Video-Player-v1.0.33-Release
        path: app/build/outputs/apk/release/*.apk
