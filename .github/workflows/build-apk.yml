name: Build AG Video Player APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Prepare release signing keystore
        id: signing
        run: |
          if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "has_persistent_key=true" >> "$GITHUB_OUTPUT"
          else
            # Fallback signing key so first-time builds produce a ready-to-install release APK.
            # Add SIGNING_KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD secrets for seamless updates.
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android123 \
              -keypass android123 \
              -dname "CN=AG Video Player, OU=Mobile, O=AG, L=Dhaka, C=BD"
            echo "STORE_PASSWORD=android123" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android123" >> "$GITHUB_ENV"
            echo "has_persistent_key=false" >> "$GITHUB_OUTPUT"
          fi
          echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> "$GITHUB_ENV"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build R8-Minified Release APK & Debug APK
        run: gradle :app:assembleRelease :app:assembleDebug

      - name: Rename Release APK
        id: app_meta
        run: |
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed 's/[^0-9]*//g')
          cp "$RELEASE_APK" "AG-Video-Player-v${VERSION_NAME}.apk"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          ls -lh "AG-Video-Player-v${VERSION_NAME}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AG-Video-Player-APK
          path: |
            AG-Video-Player-v*.apk
            app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release with APK (on version tag or manual run)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.app_meta.outputs.version_name) }}
          name: "AG Video Player v${{ steps.app_meta.outputs.version_name }}"
          body: |
            Automated R8-minified APK build for **AG Video Player**.
            versionCode: ${{ steps.app_meta.outputs.version_code }}
          files: AG-Video-Player-v*.apk
          generate_release_notes: true
