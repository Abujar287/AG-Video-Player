name: Build Video Player APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_SECRET: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDK_MANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -n "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Compute auto-incremented app version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF_NAME#v}"
            MAJOR=$(echo "$RAW_TAG" | cut -d. -f1 | tr -dc '0-9')
            MINOR=$(echo "$RAW_TAG" | cut -d. -f2 | tr -dc '0-9')
            PATCH=$(echo "$RAW_TAG" | cut -d. -f3 | tr -dc '0-9')
            MAJOR=${MAJOR:-1}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
            NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            NEXT_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          else
            RELEASE_TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name' 2>/dev/null) || RELEASE_TAG=""
            GIT_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1 2>/dev/null) || GIT_TAG=""
            LATEST_TAG=$(printf '%s\n%s\n' "$RELEASE_TAG" "$GIT_TAG" | grep -E '^v[0-9]+' | sort -V | tail -n 1 || true)
            if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
              NEXT_VERSION="1.0.0"
              NEXT_CODE=10000
            else
              CLEAN_VER="${LATEST_TAG#v}"
              MAJOR=$(echo "$CLEAN_VER" | cut -d. -f1 | tr -dc '0-9')
              MINOR=$(echo "$CLEAN_VER" | cut -d. -f2 | tr -dc '0-9')
              PATCH=$(echo "$CLEAN_VER" | cut -d. -f3 | tr -dc '0-9')
              MAJOR=${MAJOR:-1}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
              NEXT_PATCH=$((PATCH + 1))
              NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"
              NEXT_CODE=$((MAJOR * 10000 + MINOR * 100 + NEXT_PATCH))
            fi
          fi
          PREV_BODY=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.body' 2>/dev/null) || PREV_BODY=""
          PREV_CODE=$(echo "$PREV_BODY" | grep -iE 'versionCode[[:space:]]*[:=][[:space:]]*[0-9]+' | grep -oE '[0-9]+' | head -n 1 || true)
          if [ -n "$PREV_CODE" ] && [ "$NEXT_CODE" -le "$PREV_CODE" ]; then
            NEXT_CODE=$((PREV_CODE + 1))
          fi
          if [ "$NEXT_CODE" -lt 1 ]; then
            NEXT_CODE=1
          fi
          echo "version_name=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${NEXT_CODE}" >> "$GITHUB_OUTPUT"
          echo "Building AG Video Player v${NEXT_VERSION} (versionCode=${NEXT_CODE})"

      - name: Restore cached release keystore if no secret is set
        if: env.HAS_SIGNING_SECRET != 'true'
        uses: actions/cache@v4
        with:
          path: my-upload-key.jks
          key: ag-release-keystore-${{ github.repository }}-v1
          restore-keys: |
            ag-release-keystore-${{ github.repository }}-

      - name: Prepare persistent release signing keystore
        id: signing
        run: |
          if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> "$GITHUB_ENV"
            if [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
              echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            else
              echo "KEY_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> "$GITHUB_ENV"
            fi
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS || 'upload' }}" >> "$GITHUB_ENV"
          else
            if [ ! -f my-upload-key.jks ]; then
              keytool -genkeypair -noprompt \
                -keystore my-upload-key.jks \
                -storetype PKCS12 \
                -alias upload \
                -keyalg RSA \
                -sigalg SHA256withRSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass android123 \
                -keypass android123 \
                -dname "CN=AG Video Player, OU=Mobile, O=AG, L=Dhaka, C=BD"
            fi
            echo "STORE_PASSWORD=android123" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=upload" >> "$GITHUB_ENV"
          fi
          if [ ! -s my-upload-key.jks ]; then
            echo "ERROR: Signing keystore my-upload-key.jks is missing or empty!"
            exit 1
          fi
          echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> "$GITHUB_ENV"
          keytool -list -keystore my-upload-key.jks -storepass "${STORE_PASSWORD:-android123}" -alias "${KEY_ALIAS:-upload}" | grep -E "Alias|SHA1|SHA256" || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Run sequentially without parallel/config-cache to avoid KSP2 ApplicationManager NPE
      - name: Build R8-Minified Release APK
        run: >
          gradle :app:assembleRelease
          --no-parallel
          --no-configuration-cache
          -PappVersionCode=${{ steps.version.outputs.version_code }}
          -PappVersionName=${{ steps.version.outputs.version_name }}
          -PgithubRepoSlug=${{ github.repository }}

      - name: Package, Zipalign & Verify Release APK Signature
        run: |
          RELEASE_APK=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" ! -name "*-unsigned.apk" | head -n 1)
          if [ -z "$RELEASE_APK" ] || [ ! -s "$RELEASE_APK" ]; then
            echo "ERROR: Signed release APK not found!"
            ls -la app/build/outputs/apk/release || true
            exit 1
          fi

          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          if ! "$ZIPALIGN" -c -p 4 "$RELEASE_APK" >/dev/null 2>&1; then
            echo "APK is not 4-byte aligned; aligning and re-signing..."
            "$ZIPALIGN" -f -p 4 "$RELEASE_APK" "aligned-release.apk"
            "$APKSIGNER" sign \
              --ks "$KEYSTORE_PATH" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "env:STORE_PASSWORD" \
              --key-pass "env:KEY_PASSWORD" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --out "AG Video Player.apk" \
              "aligned-release.apk"
            rm -f "aligned-release.apk"
          else
            cp "$RELEASE_APK" "AG Video Player.apk"
          fi

          "$ZIPALIGN" -c -p 4 "AG Video Player.apk"
          "$APKSIGNER" verify --verbose --print-certs "AG Video Player.apk"
          ls -lh "AG Video Player.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AG-Video-Player-APK
          path: AG Video Player.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: "AG Video Player v${{ steps.version.outputs.version_name }}"
          body: |
            AG Video Player v${{ steps.version.outputs.version_name }}
            versionCode: ${{ steps.version.outputs.version_code }}
          files: "AG Video Player.apk"
          make_latest: true
          generate_release_notes: true
