name: Build Video Player APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_SECRET: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDK_MANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -n "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Compute auto-incremented app version (1.0.0 -> 1.0.1 -> 1.0.2)
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF_NAME#v}"
            MAJOR=$(echo "$RAW_TAG" | cut -d. -f1)
            MINOR=$(echo "$RAW_TAG" | cut -d. -f2)
            PATCH=$(echo "$RAW_TAG" | cut -d. -f3 | tr -dc '0-9')
            MAJOR=${MAJOR:-1}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
            NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            NEXT_CODE=$((PATCH + 1))
          else
            RELEASE_TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name' 2>/dev/null) || RELEASE_TAG=""
            GIT_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1 2>/dev/null) || GIT_TAG=""
            LATEST_TAG="$RELEASE_TAG"
            if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
              LATEST_TAG="$GIT_TAG"
            fi
            if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
              NEXT_VERSION="1.0.0"
              NEXT_CODE=1
            else
              CLEAN_VER="${LATEST_TAG#v}"
              MAJOR=$(echo "$CLEAN_VER" | cut -d. -f1 | tr -dc '0-9')
              MINOR=$(echo "$CLEAN_VER" | cut -d. -f2 | tr -dc '0-9')
              PATCH=$(echo "$CLEAN_VER" | cut -d. -f3 | tr -dc '0-9')
              MAJOR=${MAJOR:-1}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
              NEXT_PATCH=$((PATCH + 1))
              NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"
              NEXT_CODE=$((NEXT_PATCH + 1))
            fi
          fi
          echo "version_name=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${NEXT_CODE}" >> "$GITHUB_OUTPUT"
          echo "Building Video Player v${NEXT_VERSION} (versionCode=${NEXT_CODE})"

      - name: Restore cached release keystore if no secret is set
        if: env.HAS_SIGNING_SECRET != 'true'
        uses: actions/cache@v4
        with:
          path: my-upload-key.jks
          key: ag-release-keystore-${{ github.repository }}-v1

      - name: Prepare persistent release signing keystore
        id: signing
        run: |
          if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            if [ ! -f my-upload-key.jks ]; then
              keytool -genkeypair -noprompt \
                -keystore my-upload-key.jks \
                -alias upload \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass android123 \
                -keypass android123 \
                -dname "CN=Video Player, OU=Mobile, O=AG, L=Dhaka, C=BD"
            fi
            echo "STORE_PASSWORD=android123" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android123" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> "$GITHUB_ENV"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Run sequentially without parallel/config-cache to avoid KSP2 ApplicationManager NPE
      - name: Build R8-Minified Release APK
        run: >
          gradle :app:assembleRelease
          --no-parallel
          --no-configuration-cache
          -PappVersionCode=${{ steps.version.outputs.version_code }}
          -PappVersionName=${{ steps.version.outputs.version_name }}
          -PgithubRepoSlug=${{ github.repository }}

      - name: Package Release APK
        run: |
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$RELEASE_APK" "Video-Player-v${{ steps.version.outputs.version_name }}.apk"
          ls -lh "Video-Player-v${{ steps.version.outputs.version_name }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Video-Player-APK
          path: Video-Player-v*.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: "Video Player v${{ steps.version.outputs.version_name }}"
          body: |
            Automated R8-minified APK build for **Video Player v${{ steps.version.outputs.version_name }}**.
            versionCode: ${{ steps.version.outputs.version_code }}
          files: Video-Player-v*.apk
          make_latest: true
          generate_release_notes: true
